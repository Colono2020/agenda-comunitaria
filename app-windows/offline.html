<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sem internet - Agenda Comunitária</title>
    <style>
        body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #f6f4ef; color: #263238; }
        .topo { background: #2e7d32; color: #fff; padding: 14px 16px; font-weight: 700; font-size: 1.1rem; }
        .cartao { background: #fff; margin: 16px; padding: 30px 16px; border-radius: 14px; text-align: center;
                  box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        h1 { font-size: 1.3rem; margin: 6px 0 10px; }
        p { color: #607d8b; }
        button { background: #2e7d32; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px;
                 font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="topo">🌱 Agenda Comunitária</div>
<div class="cartao">
    <div style="font-size:3rem">📶</div>
    <h1>Sem internet</h1>
    <p>Não foi possível abrir a Agenda Comunitária. Verifique se o computador está conectado à internet.</p>
    <button type="button" onclick="voltar()">Tentar de novo</button>
</div>
<script>
function voltar() {
    var destino = new URLSearchParams(location.search).get('voltar');
    if (destino) location.href = destino;
}
// Quando a conexão voltar, tenta sozinho
window.addEventListener('online', voltar);
</script>
</body>
</html>
